name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [claude/fervent-heisenberg-9bybm2]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests (Windows)
        run: python -m pytest -q tests

      - name: Build exe
        run: python build.py

      - name: Self-test built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MacroTool.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MacroTool-windows
          path: dist/MacroTool.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacroTool.exe
