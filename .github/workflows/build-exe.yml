name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

env:
  PYTHONUTF8: "1"  # 한글 출력이 cp1252 콘솔에서 실패하지 않도록
  NUMPY_VERSION: "2.3.5"  # BLAS 없이 소스에서 빌드할 numpy (바꾸면 캐시도 새로 만든다)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # 부트로더를 소스에서 직접 컴파일 (미리 빌드된 부트로더는 악성코드도 많이 써서 백신 오탐이 잦다)
          pip install --no-binary pyinstaller pyinstaller
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"

      # numpy 를 BLAS/LAPACK 없이 빌드: exe 에서 OpenBLAS DLL(수십 MB)이 빠진다 (FFT·기본 연산만 쓰므로 속도 차이 없음)
      - name: Cache numpy without BLAS
        id: numpy-cache
        uses: actions/cache@v4
        with:
          path: numpy-wheel
          key: numpy-noblas-${{ runner.os }}-py312-${{ env.NUMPY_VERSION }}

      - name: Build numpy without BLAS
        if: steps.numpy-cache.outputs.cache-hit != 'true'
        run: pip wheel "numpy==${{ env.NUMPY_VERSION }}" --no-binary numpy --no-deps -w numpy-wheel "-Csetup-args=--vsenv" "-Csetup-args=-Dblas=none" "-Csetup-args=-Dlapack=none" "-Csetup-args=-Dallow-noblas=true"

      - name: Install numpy without BLAS
        shell: pwsh
        run: |
          pip install --force-reinstall --no-deps (Get-Item numpy-wheel\numpy-*.whl).FullName
          python -c "import numpy; b = numpy.show_config('dicts')['Build Dependencies']['blas']['name']; print('numpy', numpy.__version__, 'blas', b); assert b == 'none'"

      - name: Check bootloader was compiled
        run: python -c "import PyInstaller, pathlib, time; p = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe'; age = time.time() - p.stat().st_mtime; print(p, p.stat().st_size, 'bytes', int(age), 's old'); assert age < 3600, 'prebuilt bootloader'"

      - name: Run tests (Windows)
        run: python -m pytest -q tests

      - name: Build exe
        run: python build.py

      - name: Self-test built exe
        shell: pwsh
        run: |
          $dir = "dist\MacroTool-windows\MacroTool"
          $p = Start-Process -FilePath "$dir\MacroTool.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$dir\selftest.log"
          Remove-Item "$dir\selftest.log"  # 배포 폴더에 남기지 않는다
          if ($p.ExitCode -ne 0) { exit 1 }
          (Get-Item "$dir\MacroTool.exe").VersionInfo | Format-List FileDescription, FileVersion, ProductName

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MacroTool-windows
          path: dist/MacroTool-windows/
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacroTool-windows.zip
